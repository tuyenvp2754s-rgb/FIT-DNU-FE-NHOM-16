<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập Admin - PetAdopt</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #fef3c7, #f8fafc);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .login-card {
        width: min(92vw, 420px);
        border: none;
        border-radius: 16px;
        box-shadow: 0 12px 40px rgba(15, 23, 42, 0.15);
      }
    </style>
  </head>
  <body>
    <div class="card login-card p-4">
      <h3 class="fw-bold mb-2">Đăng nhập Admin</h3>
      <p class="text-muted mb-4">
        Bạn cần đăng nhập để truy cập trang quản trị.
      </p>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Tên đăng nhập</label>
          <input id="username" type="text" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Mật khẩu</label>
          <input id="password" type="password" class="form-control" required />
        </div>
        <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
      </form>
      <p class="text-muted small mt-3 mb-0">Mẫu demo: admin / 123456</p>
    </div>

    <script>
      const ADMIN_AUTH_KEY = "adminAuth";
      const ADMIN_TOKEN_KEY = "adminToken";

      const params = new URLSearchParams(window.location.search);
      const redirect = params.get("redirect") || "admin.html";

      document
        .getElementById("loginForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          const username = document.getElementById("username").value.trim();
          const password = document.getElementById("password").value;

          if (!username || !password) {
            alert("Vui lòng nhập đầy đủ thông tin");
            return;
          }

          if (username === "admin" && password === "123456") {
            localStorage.setItem(ADMIN_AUTH_KEY, "true");
            localStorage.setItem(ADMIN_TOKEN_KEY, "demo-admin-token");
            window.location.href = redirect;
          } else {
            alert("Thông tin đăng nhập không đúng. Hãy dùng admin / 123456");
          }
        });
    </script>
  </body>
</html>
