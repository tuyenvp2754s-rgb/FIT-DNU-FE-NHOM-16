<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>PetAdopt Admin Full</title>

<style>
:root{
  --bg:#f3f4f6;
  --sidebar:#111827;
  --green:#10b981;
}

body{
  margin:0;
  font-family:sans-serif;
  display:flex;
  background:var(--bg);
}

/* LOGIN */
#login{
  position:fixed;
  inset:0;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.login-box{
  padding:40px;
  border:1px solid #ddd;
  border-radius:12px;
  text-align:center;
}

input{
  padding:10px;
  margin:10px 0;
  width:220px;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  height:100vh;
  background:var(--sidebar);
  color:white;
  padding:20px;
  position:fixed;
}

.sidebar h2{ color:var(--green); }

.menu div{
  padding:12px;
  margin:8px 0;
  cursor:pointer;
  border-radius:8px;
}

.menu div:hover{ background:#1f2937; }

/* MAIN */
.main{
  margin-left:260px;
  padding:30px;
  width:100%;
}

.hidden{ display:none; }

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}

table{
  width:100%;
  background:white;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid #eee;
}

th{ background:#e5e7eb; }

.btn{
  padding:6px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.btn-add{ background:#10b981; color:white; }
.btn-del{ background:#ef4444; color:white; }
.btn-ok{ background:#3b82f6; color:white; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h2>Admin Login</h2>

    <input id="username" placeholder="username">
    <input id="password" type="password" placeholder="password">

    <button onclick="login()" class="btn btn-add">Login</button>

    <p id="error" style="color:red"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>🐾 PetAdopt</h2>

    <div class="menu">
      <div onclick="show('dashboard')">📊 Dashboard</div>
      <div onclick="show('pets')">🐶 Pets</div>
      <div onclick="show('adopt')">📋 Adoptions</div>
      <div onclick="goHome()">🏠 Quay về trang chủ</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <section id="dashboard">
      <h1>Dashboard</h1>
      <div class="card" id="stat">Loading...</div>
    </section>

    <section id="pets" class="hidden">
      <h1>Pets</h1>

      <div class="card">
        <input id="petName" placeholder="Tên thú cưng">
        <button class="btn btn-add" onclick="addPet()">+ Thêm</button>
      </div>

      <table>
        <thead>
          <tr><th>ID</th><th>Name</th><th>Action</th></tr>
        </thead>
        <tbody id="petTable"></tbody>
      </table>
    </section>

    <section id="adopt" class="hidden">
      <h1>Adoptions</h1>

      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Pet</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="adTable"></tbody>
      </table>
    </section>

  </div>
</div>

<script>

const API_PETS = "https://6a0d322e769682b8ee75c462.mockapi.io/api/v1/pets";
const API_ADS  = "https://6a0d322e769682b8ee75c462.mockapi.io/api/v1/adoptions";

/* LOGIN FIX CHUẨN */
function login(){

  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value.trim();

  const err = document.getElementById("error");

  if(u === "admin" && p === "admin"){
    document.getElementById("login").style.display = "none";
    document.getElementById("app").classList.remove("hidden");

    load();
    setInterval(load, 8000);
  } else {
    err.innerText = "Sai tài khoản hoặc mật khẩu";
  }
}

/* NAV */
function show(id){
  document.querySelectorAll("section").forEach(s=>s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

/* BACK HOME */
function goHome(){
  window.location.href = "index.html";
}

/* LOAD DATA */
async function load(){

  try{

    const [pets, ads] = await Promise.all([
      fetch(API_PETS).then(r=>r.json()),
      fetch(API_ADS).then(r=>r.json())
    ]);

    document.getElementById("stat").innerHTML = `
      🐶 Pets: ${pets.length} <br>
      📋 Ads: ${ads.length} <br>
      🟡 Pending: ${ads.filter(a=>a.status==="pending").length} <br>
      🟢 Approved: ${ads.filter(a=>a.status==="approved").length}
    `;

    document.getElementById("petTable").innerHTML =
      pets.map(p=>`
        <tr>
          <td>${p.id}</td>
          <td>${p.name}</td>
          <td><button class="btn btn-del" onclick="delPet('${p.id}')">Xóa</button></td>
        </tr>
      `).join("");

    document.getElementById("adTable").innerHTML =
      ads.map(a=>`
        <tr>
          <td>${a.name || "User"}</td>
          <td>${a.petName || "Pet"}</td>
          <td>${badge(a.status)}</td>
          <td>
            ${
              a.status === "approved"
              ? "✅"
              : `<button class="btn btn-ok" onclick="approve('${a.id}')">Duyệt</button>`
            }
          </td>
        </tr>
      `).join("");

  } catch(e){
    console.log("API error", e);
  }
}

/* STATUS */
function badge(s){
  if(s==="approved") return "🟢 approved";
  if(s==="rejected") return "🔴 rejected";
  return "🟡 pending";
}

/* PET */
async function addPet(){
  const name = document.getElementById("petName").value.trim();
  if(!name) return;

  await fetch(API_PETS,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name})
  });

  document.getElementById("petName").value="";
  load();
}

async function delPet(id){
  await fetch(`${API_PETS}/${id}`,{method:"DELETE"});
  load();
}

/* ADOPTION */
async function approve(id){
  await fetch(`${API_ADS}/${id}`,{
    method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({status:"approved"})
  });

  load();
}

</script>

</body>
</html>
